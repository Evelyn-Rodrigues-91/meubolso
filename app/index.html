<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6b46e5">
  <title>Meu Bolso</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main>
    <p id="carregando" class="sub">Carregando…</p>

    <!-- Tela de entrada -->
    <section id="tela-entrada" hidden>
      <div class="marca">
        <svg class="nota" viewBox="0 0 64 40" aria-hidden="true">
          <defs>
            <linearGradient id="gn1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#2f7bf5"/></linearGradient>
            <clipPath id="cn1"><rect width="64" height="40" rx="6"/></clipPath>
          </defs>
          <g clip-path="url(#cn1)">
            <rect width="64" height="40" fill="url(#gn1)"/>
            <g class="brilho"><rect x="-24" y="-6" width="12" height="52" fill="#fff" opacity=".4" transform="skewX(-20)"/></g>
          </g>
          <rect x="4" y="4" width="56" height="32" rx="3" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.2"/>
          <circle cx="32" cy="20" r="9" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-width="1.5"/>
          <text x="32" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">R$</text>
          <circle cx="11" cy="20" r="2.5" fill="#fff" fill-opacity=".7"/>
          <circle cx="53" cy="20" r="2.5" fill="#fff" fill-opacity=".7"/>
        </svg>
        <h1>Meu Bolso</h1>
      </div>
      <p class="sub">Entre para ver seus gastos.</p>
      <form id="form-entrada" class="cartao">
        <label>E-mail
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>Senha
          <input id="senha" type="password" autocomplete="current-password" minlength="6" required>
        </label>
        <div class="linha">
          <button type="submit" id="btn-entrar">Entrar</button>
          <button type="button" id="btn-criar" class="secundario">Criar conta</button>
        </div>
        <p id="msg-entrada" class="msg" role="alert"></p>
      </form>
    </section>

    <!-- Tela principal -->
    <section id="tela-app" hidden>
      <header class="topo">
        <div class="marca">
          <svg class="nota" viewBox="0 0 64 40" aria-hidden="true">
            <defs>
              <linearGradient id="gn2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#2f7bf5"/></linearGradient>
              <clipPath id="cn2"><rect width="64" height="40" rx="6"/></clipPath>
            </defs>
            <g clip-path="url(#cn2)">
              <rect width="64" height="40" fill="url(#gn2)"/>
              <g class="brilho"><rect x="-24" y="-6" width="12" height="52" fill="#fff" opacity=".4" transform="skewX(-20)"/></g>
            </g>
            <rect x="4" y="4" width="56" height="32" rx="3" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.2"/>
            <circle cx="32" cy="20" r="9" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-width="1.5"/>
            <text x="32" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">R$</text>
            <circle cx="11" cy="20" r="2.5" fill="#fff" fill-opacity=".7"/>
            <circle cx="53" cy="20" r="2.5" fill="#fff" fill-opacity=".7"/>
          </svg>
          <h1>Meu Bolso</h1>
        </div>
        <button type="button" id="btn-sair" class="secundario pequeno">Sair</button>
      </header>

      <div class="cartao destaque">
        <div class="numero-bloco">
          <span class="rotulo">Hoje</span>
          <strong id="total-hoje">R$ 0,00</strong>
        </div>
        <div class="numero-bloco">
          <span class="rotulo" id="rotulo-mes">No mês</span>
          <strong id="total-mes">R$ 0,00</strong>
          <span class="rotulo" id="media-dia">Média de R$ 0,00 por dia</span>
        </div>
      </div>

      <div class="cartao" id="cartao-resumo" hidden>
        <h2>Resumo da semana</h2>
        <p id="texto-resumo"></p>
      </div>

      <form id="form-gasto" class="cartao">
        <h2>Lançar à mão</h2>
        <fieldset class="categorias">
          <legend>Categoria</legend>
          <div id="categoria" class="chips"></div>
        </fieldset>
        <label>Valor (R$)
          <input id="valor" type="text" inputmode="decimal" placeholder="0,00" required>
        </label>
        <label>Onde ou com o quê
          <input id="descricao" type="text" maxlength="80" placeholder="Ex.: padaria">
        </label>
        <label>Data
          <input id="data" type="date" required>
        </label>
        <button type="submit">Salvar gasto</button>
        <p id="msg-gasto" class="msg" role="alert"></p>
      </form>

      <div class="cartao">
        <h2>Por categoria</h2>
        <div id="barras"></div>
      </div>

      <div class="cartao">
        <h2>Gastos do mês</h2>
        <ul id="lista" class="lista"></ul>
        <p id="msg-lista" class="msg" role="alert"></p>
      </div>

      <div class="cartao">
        <h2>Assistente</h2>
        <div class="linha">
          <input id="assistente-texto" type="text" placeholder="Ex.: gastei 30 no almoço">
          <button type="button" id="btn-mic" class="microfone" aria-label="Falar com o assistente" title="Falar com o assistente">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="3" width="6" height="11" rx="3"/>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
            </svg>
          </button>
          <button type="button" id="btn-enviar">Enviar</button>
        </div>
        <p id="dica-voz" class="msg" hidden>Use o microfone do teclado do celular.</p>
        <button type="button" id="btn-foto" class="secundario">Foto do cupom</button>
        <p id="msg-assistente" class="msg"></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="configuracao.js"></script>
  <script src="app.js"></script>
</body>
</html>
